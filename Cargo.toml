[workspace]
resolver = "3"
members = [
    "crates/bootstrap",
    "crates/hosts/local-bridge",
    "crates/surfaces/server",
]

[workspace.package]
version = "0.2.38"
edition = "2024"
license = "MIT"
repository = "https://github.com/Ky1eYang/microcrab-apps"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
microcrab-protocol = { git = "https://github.com/Ky1eYang/microcrab-core", rev = "d7643a0fcb07892c4b7dcd5174d3a10cbff73b50" }
microcrab-permission = { git = "https://github.com/Ky1eYang/microcrab-core", rev = "d7643a0fcb07892c4b7dcd5174d3a10cbff73b50" }
microcrab-auditor = { git = "https://github.com/Ky1eYang/microcrab-core", rev = "d7643a0fcb07892c4b7dcd5174d3a10cbff73b50" }
microcrab-transport = { git = "https://github.com/Ky1eYang/microcrab-core", rev = "d7643a0fcb07892c4b7dcd5174d3a10cbff73b50" }
microcrab-host-api = { git = "https://github.com/Ky1eYang/microcrab-core", rev = "d7643a0fcb07892c4b7dcd5174d3a10cbff73b50" }
microcrab-host-local = { git = "https://github.com/Ky1eYang/microcrab-core", rev = "d7643a0fcb07892c4b7dcd5174d3a10cbff73b50" }

microcrab-agent-types = { git = "https://github.com/Ky1eYang/microcrab-core", rev = "d7643a0fcb07892c4b7dcd5174d3a10cbff73b50" }

microcrab-session = { git = "https://github.com/Ky1eYang/microcrab-core", rev = "d7643a0fcb07892c4b7dcd5174d3a10cbff73b50" }

microcrab-storage = { git = "https://github.com/Ky1eYang/microcrab-core", rev = "d7643a0fcb07892c4b7dcd5174d3a10cbff73b50", default-features = false }

microcrab-creator = { git = "https://github.com/Ky1eYang/microcrab-core", rev = "d7643a0fcb07892c4b7dcd5174d3a10cbff73b50", default-features = false }

microcrab-host-protocol = { git = "https://github.com/Ky1eYang/microcrab-core", rev = "d7643a0fcb07892c4b7dcd5174d3a10cbff73b50" }

microcrab-host-remote = { git = "https://github.com/Ky1eYang/microcrab-core", rev = "d7643a0fcb07892c4b7dcd5174d3a10cbff73b50" }
