[package]
name = "microcrab-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["storage-sqlite"]
dev = ["dep:rsa"]
storage-file = ["microcrab-storage/storage-file", "microcrab-creator/storage-file"]
storage-sqlite = ["microcrab-storage/storage-sqlite", "microcrab-creator/storage-sqlite"]
grpc = ["microcrab-host-protocol/grpc", "dep:tonic", "dep:tokio-stream"]

[dependencies]
axum = { version = "0.8.9", features = ["ws", "json", "query"] }
tower-http = { version = "0.6", features = ["fs", "limit"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
oauth2 = { version = "5.0.0", default-features = false, features = ["reqwest"] }
jwt-simple = { version = "0.15.0", default-features = false, features = ["pure-rust"] }
rsa = { version = "=0.9.10", optional = true, features = ["getrandom"] }
url = "2"
sha2 = "0.10.9"
base64.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = { version = "0.8.23", default-features = false, features = ["parse"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["signal"] }
tokio-util.workspace = true
tracing.workspace = true
futures-util.workspace = true
uuid.workspace = true
reqwest.workspace = true
tokio-tungstenite = "0.29.0"
tokio-stream = { version = "0.1", optional = true }
tonic = { version = "0.13", optional = true }
microcrab-protocol.workspace = true
microcrab-permission.workspace = true
microcrab-auditor.workspace = true
microcrab-host-api.workspace = true
microcrab-host-local.workspace = true
microcrab-host-remote = { workspace = true }
microcrab-host-protocol = { workspace = true }
microcrab-agent-types.workspace = true
microcrab-transport.workspace = true
microcrab-session = { workspace = true }
microcrab-storage = { workspace = true, default-features = false }
microcrab-creator = { workspace = true, default-features = false }

[dev-dependencies]
wat = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
